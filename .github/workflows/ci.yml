name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Unproven until the first CI run: whether validate works without credentials.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck
      # /bin/bash is 3.2 on macOS, so a bash 4 feature fails here.
      - name: Test
        run: /bin/bash test/run.sh
      - name: Lint this repository's own cards
        run: /bin/bash bin/card lint
      - name: Validate the plugin and marketplace manifests
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
          for d in agents skills; do [ ! -d "$d" ] || claude plugin validate --strict "$d"; done
      # Ubuntu's default awk is mawk; other distributions ship gawk. They
      # differ from each other and from the awk on macOS.
      - name: Test with awk as mawk and as gawk
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gawk mawk > /dev/null
          for a in mawk gawk; do
            mkdir -p "$RUNNER_TEMP/$a"
            ln -sf "$(command -v "$a")" "$RUNNER_TEMP/$a/awk"
            PATH="$RUNNER_TEMP/$a:$PATH" /bin/bash test/run.sh
          done
